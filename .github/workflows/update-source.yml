name: Update app source
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: remio-source
  cancel-in-progress: false
jobs:
  source:
    if: ${{ !github.event.release.prerelease }}
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download published IPA and notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --pattern Remio.ipa --dir dist
          gh release view "$TAG" --json body --jq .body > dist/notes.md
      - name: Update source from the published binary
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
        run: python3 scripts/update-source.py --ipa dist/Remio.ipa --repository "$REPOSITORY" --tag "$TAG" --notes dist/notes.md --date "$RELEASE_DATE"
      - name: Commit source update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add distribution/source.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Remio app source'
            git push origin HEAD:main
          fi
